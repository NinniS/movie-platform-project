<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Homepage</title>
    <link rel="stylesheet" href="/frontend/CSS/style.css">
</head>

<body>
    <div id="navigation">
        <div>
            <a href="/homepage">
                <h1>MWN Movieloverz</h1>
            </a>
            <div>
                <div id="user-review-button"></div>
                <div id="login"></div>
            </div>
        </div>
    </div>
    <main>
        <section id="filtering">
            <h2>Welcome!</h2>

            <form id="search-filter">
                <input id="search-bar" name="search" type="text" placeholder="Search...">
            </form>
            <form id="movie-filter">
                <select class="button" id="genre" name="genre">
                    <option value="">GENRE</option>
                </select>

                <div id="filter-number">
                    <div class="filter-input">
                        <p>DURATION</p>
                        <input type="number" name="duration_min" placeholder="Min">
                        <input type="number" name="duration_max" placeholder="Max">
                    </div>
                    <div class="filter-input">
                        <div>
                            <p>YEAR</p>
                            <input type="text" name="year_min" placeholder="Min">
                            <input type="text" name="year_max" placeholder="Max">
                        </div>
                    </div>
                </div>

                <input class="button" type="submit" value="Filter"></input>
            </form>
            </div>
        </section>

        <div id="movie-section">
            <div id="all-movies">

            </div>
        </div>
    </main>
    <footer>
        <img class="expressions" src="/frontend/images/expressions.gif" height=150px>
        <p>MWN Movieloverz</p>
    </footer>
    <script src="/assets/JS/api.js"></script>
    <script src="/assets/JS/ui.js"></script>
    <script src="/assets/JS/homepage.js"></script>
    <script src="/assets/JS/login.js"></script>
</body>

</html>
