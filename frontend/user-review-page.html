<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>My reviews</title>
    <link rel="stylesheet" href="/frontend/CSS/movie.css">
</head>

<body>
    <div id="navigation">
        <div>
            <a href="/homepage">
                <h1>MWN Movieloverz</h1>
            </a>
            <div>
                <div id="user-review-button"></div>
                <div id="login"></div>
            </div>
        </div>
    </div>

    <h2> My reviews </h2>

    <div id="my-reviews"></div>

    <div class="review-form">

        <form id="edit-review-form">
            <h3> Edit review </h3>

            <p> Select review: </p>
            <select name="select-review">
                <option value=""> Select review </option>
            </select>


            <p> Score: </p>
            <input type="text" name="score" placeholder="Score..." required> </input>

            <p> Review text: </p>
            <textarea name="reviewText" placeholder="Review text..." required> </textarea>

            <button id="edit-review-button" type="button"> SAVE </button>
            <button id="delete-review-button" type="button"> DELETE</button>

    <div id="user-reviews"> </div>
    <script src="/assets/JS/api.js"></script>
    <script src="/assets/JS/ui.js"></script>
    <script src="/assets/JS/userReviews.js"></script>
    <script src="../assets/JS/login.js"></script>
</body>

</html>
