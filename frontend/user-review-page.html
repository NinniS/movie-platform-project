<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>My reviews</title>
    <link rel="stylesheet" href="/frontend/CSS/movie.css">
</head>

<body>
    <div id="navigation">
        <div>
            <a href="/homepage">
                <img src="/frontend/images/pointer.png" height=60px>
                <h1>MWN Movieloverz</h1>
            </a>
            <div>
                <div id="user-review-button"></div>
                <div id="login"></div>
            </div>
        </div>
    </div>

    <h1> My reviews </h1>
    <div id="main-section">
        <div id="my-reviews"></div>

        <div>
            
            <form id="edit-review">
                <div id="edit-review-titel">
                    <h3> Edit review </h3>
                    <img src="/frontend/images/great.png" height="60px">
                </div>

                <div>
                    <p> Review: </p>
                    <input type="text" name="review" placeholder="Review..." required> </input>

                    <p> Score: </p>
                    <input type="text" name="score" placeholder="Score..." required> </input>

                    <p> Review text: </p>
                    <textarea name="review-text" placeholder="Review text..." required> </textarea>
                </div>
                <div>
                    <button id="edit-review-button" type="button"> SAVE </button>
                    <button id="delete-review-button" type="button"> DELETE</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/assets/JS/api.js"></script>
    <script src="/assets/JS/ui.js"></script>
    <script src="/assets/JS/userReviews.js"></script>
    <script src="../assets/JS/login.js"></script>
</body>

</html>
