<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Review</title>
        <link rel="stylesheet" href="/frontend/CSS/style.css">
    </head>
    <body>
        <div id="navigation">
        <div>
            <a href="/homepage">
                <h1>MWN Movieloverz</h1>
            </a>
            <div id="login">
            </div>
        </div>
    </div>
    <section id="review-section">
        <h2>Create a Review</h2>
        <form id="review-form">
            <select name="chosen-movie" id="chosen-movie">
            </select>
            <select required name="score">
                <option value="">Choose Rating</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
            </select>
            <textarea required style="width: 250px; height: 100px" name="review-text" placeholder="Enter text..."></textarea>
            <input type="submit" value="Submit"></input>
        </form>
    </section>
    <script src="/assets/JS/api.js"></script>
    <script src="/assets/JS/ui.js"></script>
    <script src="/assets/create-review.js"></script>
    <script src="/assets/JS/login.js"></script>
    </body>
</html>
